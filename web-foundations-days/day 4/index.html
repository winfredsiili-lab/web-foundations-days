<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Note Counter</h1>
      <p>Write a note and watch the limit.</p>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <main>
      <section>
        <label for="note-text">Your note</label>
        <textarea id="note-text" rows="8" placeholder="Start typing..."></textarea>

        <div class="stats">
          <p id="char-count">0 / 200 characters</p>
          <p id="word-count">0 words</p>
        </div>

        <button id="clear-btn" type="button">Clear</button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Note Counter. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
